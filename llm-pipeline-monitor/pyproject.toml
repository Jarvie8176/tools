[project]
name = "llm-pipeline-monitor"
version = "0.1.0"
description = "Independent live dashboard for a local LLM inference pipeline: per-endpoint resident model, throughput (tok/s), host GPU/VRAM, per-session context, and model-swap events — Prometheus-fed."
requires-python = ">=3.14"
license = { text = "Apache-2.0" }
dependencies = []  # stdlib only — queries an upstream Prometheus over HTTP (urllib)

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]

[project.scripts]
llm-pipeline-monitor = "llm_pipeline_monitor.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["llm_pipeline_monitor*"]

[tool.setuptools.package-data]
# the committed Vite build artifact (self-contained SPA), served by webui.py
llm_pipeline_monitor = ["webui_page.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["llm_pipeline_monitor"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "def main",
]
