[project]
name = "cc-monitor"
version = "0.1.0"
description = "Independent live dashboard for Claude Code sessions (cc-session + RC env-spawned): per-session model / token / context / running-status."
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = []  # stdlib only — reads ~/.claude, /proc, /tmp/cc-session

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]

[project.scripts]
cc-monitor = "cc_monitor.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cc_monitor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["cc_monitor"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "def main",
]
